
name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: h1s97x/gh-readme-card@main
        with:
          card: user
          params: "username=kdippan&show_icons=true"
          path: profile/stats.svg

      - name: Generate Top Languages
        uses: h1s97x/gh-readme-card@main
        with:
          card: langs
          params: "username=kdippan&layout=compact"
          path: profile/languages.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || (
            git commit -m "Update GitHub profile cards"
            git push
          )
