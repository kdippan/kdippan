
name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate profile cards
        run: |
          mkdir -p profile
          curl --fail --silent --show-error --location \
            "https://github-readme-stats.vercel.app/api?username=kdippan&show_icons=true" \
            --output profile/stats.svg
          curl --fail --silent --show-error --location \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=kdippan&layout=compact" \
            --output profile/languages.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || (
            git commit -m "Update GitHub profile cards"
            git push
          )
